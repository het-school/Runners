name: runner
run-name: runner on ${{ inputs.os }}

on:
  workflow_dispatch:
    inputs:
      os:
        description: Machine to run on
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest

# Starting a new run cancels the one already running.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  run:
    name: ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 360 # hard cap for GitHub-hosted runners (6 hours)
    steps:
      - uses: actions/checkout@v7

      # Add your own steps here.

      - name: Keep alive
        shell: bash
        run: |
          # Finish 5 minutes before the 6-hour cap so the job ends green instead of being killed.
          end=$(( $(date +%s) + 355 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            echo "alive at $(date -u +%H:%M:%S) UTC, $(( (end - $(date +%s)) / 60 )) min left"
            sleep 60
          done
