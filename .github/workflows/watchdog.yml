name: watchdog

# Starts machines that should be running but aren't. Running machines already restart each other
# within a couple of minutes; this covers the first start and the case where none are left.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: watchdog

permissions:
  actions: write # start machine runs
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start missing machines
        env:
          JOIN_TOKEN: ${{ secrets.JOIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          POOL: ${{ vars.POOL || 'github' }}
          POOL_SIZE: ${{ vars.POOL_SIZE }} # how many machines this pool keeps running (empty: the control plane's default)
        run: |
          start=$(curl -sSf -X POST -H "Authorization: Bearer $JOIN_TOKEN" \
            "https://control.billybishop4-workers.xyz/api/claim?pool=$POOL&size=$POOL_SIZE" | jq -r '.start[]')
          for m in $start; do
            gh workflow run machine.yml -R "$GITHUB_REPOSITORY" -f machine="$m" && echo "started machine $m"
          done
          [ -n "$start" ] || echo "every machine is running"
