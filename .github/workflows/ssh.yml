name: ssh
run-name: Ubuntu SSH

on:
  workflow_dispatch:

# Starting a new run cancels the one already running.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # hard cap for GitHub-hosted runners (6 hours)
    permissions:
      contents: read
    steps:
      - name: Start SSH server
        env:
          PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          [ -n "$PASS" ] || { echo "::error::Add an SSH_PASSWORD repository secret first."; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server > /dev/null
          echo "runner:$PASS" | sudo chpasswd
          # 00- so it's read before the image's own sshd_config.d files; sshd keeps the first value it sees.
          printf '%s\n' 'PasswordAuthentication yes' 'PermitRootLogin no' 'AllowUsers runner' 'MaxAuthTries 3' \
            | sudo tee /etc/ssh/sshd_config.d/00-runner.conf > /dev/null
          sudo systemctl restart ssh

      - name: Connect Cloudflare tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          # The "runner" tunnel sends vm.billybishop4-workers.xyz to this machine's SSH server.
          # Clients need cloudflared as their ssh ProxyCommand to reach it.
          docker run -d --name tunnel --network host -e TUNNEL_TOKEN cloudflare/cloudflared:latest \
            tunnel --no-autoupdate run
          for i in $(seq 30); do
            docker logs tunnel 2>&1 | grep -q 'Registered tunnel connection' && break
            sleep 2
          done
          docker logs tunnel 2>&1 | grep -q 'Registered tunnel connection' || { docker logs tunnel; exit 1; }
          echo "Connect with: ssh -o ProxyCommand='cloudflared access ssh --hostname %h' runner@vm.billybishop4-workers.xyz"

      - name: Keep alive
        run: |
          # Finish 5 minutes before the 6-hour cap so the job ends green instead of being killed.
          end=$(( START + 355 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            if [ "$(docker inspect -f '{{.State.Running}}' tunnel)" != "true" ]; then
              echo "::error::tunnel stopped"; docker logs --tail 50 tunnel; exit 1
            fi
            echo "alive at $(date -u +%H:%M:%S) UTC, $(( (end - $(date +%s)) / 60 )) min left"
            sleep 60
          done
