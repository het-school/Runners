# Stremio streaming server (https://github.com/Stremio/server-docker),
# online at https://stremio-1.billybishop4-workers.xyz (replica k at https://stremio-<k>.billybishop4-workers.xyz).
x-runner:
  port: 11470
services:
  server:
    image: stremio/server:latest
    ports: ["11470:11470"]
    environment:
      NO_CORS: "1" # lets any Stremio client (web.stremio.com, apps) use it
    restart: unless-stopped
