# Control plane: project specs, placement, machine health, DNS. Knows nothing about what machines are; their agents say.
# Deploy from control/: wrangler deploy (secrets: ADMIN_TOKEN, NODE_TOKEN, and CF_API_TOKEN: Cloudflare Tunnel edit
# on the account, DNS and Workers Routes edit on the zone).
name = "runner-control"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
routes = [{ pattern = "control.billybishop4-workers.xyz", custom_domain = true }]
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

[vars]
REPO = "hetp4401/runner"
DOMAIN = "billybishop4-workers.xyz"
ZONE = "44fb65648f475249f22e9d0cffdd393d"
POOLS = '{"github": 10}' # pools of replaceable machines and their sizes (the portal can change them)
CONTROL_HOST = "control.billybishop4-workers.xyz"
ACCOUNT_ID = "8eaec409542ced2fc62e1b31228e8f85"
SCRIPT_NAME = "runner-control"
MAX_SLOTS = "50" # tunnels runner-1..runner-50 are made as slots are first used

[[durable_objects.bindings]]
name = "CONTROL"
class_name = "Control"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Control"]
