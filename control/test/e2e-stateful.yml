# End-to-end test of stateful projects: a tiny file store that writes to /data.
#   PUT /files/<name> (body)   GET /files/<name>   GET /  (lists files with sizes)   GET /whoami (hostname)
x-runner:
  port: 8099
  state: stateful
  data: /data
  storage: 50M
services:
  app:
    image: python:3.12-alpine
    user: "1000:1000"
    command:
      - python
      - -c
      - |
        import http.server, os, socket, json
        D = "/data"
        class H(http.server.BaseHTTPRequestHandler):
            def _send(self, code, body, ctype="text/plain"):
                b = body if isinstance(body, bytes) else body.encode()
                self.send_response(code); self.send_header("Content-Type", ctype); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
            def do_GET(self):
                if self.path == "/whoami": return self._send(200, socket.gethostname())
                if self.path.startswith("/files/"):
                    p = os.path.join(D, os.path.basename(self.path[7:]))
                    if not os.path.exists(p): return self._send(404, "no such file")
                    with open(p, "rb") as f: return self._send(200, f.read())
                files = {n: os.path.getsize(os.path.join(D, n)) for n in sorted(os.listdir(D)) if os.path.isfile(os.path.join(D, n))}
                return self._send(200, json.dumps({"host": socket.gethostname(), "files": files}), "application/json")
            def do_PUT(self):
                if not self.path.startswith("/files/"): return self._send(404, "put to /files/<name>")
                n = int(self.headers.get("Content-Length", 0)); body = self.rfile.read(n)
                p = os.path.join(D, os.path.basename(self.path[7:]))
                with open(p + ".tmp", "wb") as f: f.write(body)
                os.replace(p + ".tmp", p)
                return self._send(200, "stored %d bytes" % n)
            def log_message(self, *a): pass
        http.server.ThreadingHTTPServer(("", 8099), H).serve_forever()
    ports: ["8099:8099"]
    restart: unless-stopped
