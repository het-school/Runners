name: run

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:
    inputs:
      projects:
        description: Folders to run, space-separated (blank runs them all)
        default: ""

# Starting a new run cancels the one already running.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # hard cap for GitHub-hosted runners (6 hours)
    env:
      DOMAIN: billybishop4-workers.xyz
    steps:
      - uses: actions/checkout@v7

      - name: Start projects
        env:
          ONLY: ${{ inputs.projects }}
          # Repo secrets a run.sh needs go here by name, e.g. TORBOX_TOKEN: ${{ secrets.TORBOX_TOKEN }}
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          # A project is any top-level folder with a run.sh, like deploy.sh in my_apps.
          projects=${ONLY:-$(find . -mindepth 2 -maxdepth 2 -name run.sh ! -path './.*' | cut -d/ -f2 | sort)}
          started=""
          for p in $projects; do
            echo "::group::$p"
            # One failed project shouldn't take the others down, so report it and keep going.
            if [ ! -f "$p/run.sh" ]; then
              echo "::error::$p has no run.sh"
            elif [ -f "$p/Dockerfile" ] && ! docker build -t "$p:latest" "$p"; then
              echo "::error::$p: docker build failed"
            elif ! (cd "$p" && bash run.sh); then
              echo "::error::$p: run.sh failed"
            else
              started="$started $p"
            fi
            echo "::endgroup::"
          done
          echo "STARTED=$started" >> "$GITHUB_ENV"

      - name: Open Cloudflare tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          # The "runner" tunnel takes its routes from this file: <project>.$DOMAIN goes to the port in <project>/port.
          # DNS has *.$DOMAIN pointing at the tunnel, so a new project needs no DNS change.
          exposed=""
          for p in $STARTED; do
            [ -f "$p/port" ] || continue
            [[ "$p" =~ ^[a-z0-9-]+$ ]] || { echo "::warning::$p isn't a valid hostname (use a-z, 0-9, -), so it isn't exposed"; continue; }
            exposed="$exposed $p"
          done
          echo "EXPOSED=$exposed" >> "$GITHUB_ENV"
          {
            echo "ingress:"
            for p in $exposed; do
              echo "  - hostname: $p.$DOMAIN"
              echo "    service: http://localhost:$(tr -dc 0-9 < "$p/port")"
            done
            echo "  - service: http_status:404"
          } > "$RUNNER_TEMP/tunnel.yml"
          cat "$RUNNER_TEMP/tunnel.yml"
          docker run -d --name tunnel --network host --restart unless-stopped -e TUNNEL_TOKEN \
            -v "$RUNNER_TEMP/tunnel.yml:/etc/cloudflared/config.yml:ro" \
            cloudflare/cloudflared:latest tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
          for i in $(seq 30); do
            docker logs tunnel 2>&1 | grep -q 'Registered tunnel connection' && break
            sleep 2
          done
          docker logs tunnel 2>&1 | grep -q 'Registered tunnel connection' || { docker logs tunnel; exit 1; }
          for p in $exposed; do
            port=$(tr -dc 0-9 < "$p/port")
            for i in $(seq 30); do
              curl -s -o /dev/null -m 5 "http://localhost:$port" && break
              sleep 2
            done
            if curl -s -o /dev/null -m 5 "http://localhost:$port"; then
              echo "::notice::$p is live at https://$p.$DOMAIN"
            else
              echo "::warning::$p isn't answering on port $port; https://$p.$DOMAIN will fail until it does"
            fi
          done

      - name: Keep alive
        run: |
          # Finish 5 minutes before the 6-hour cap so the job ends green instead of being killed.
          end=$(( START + 355 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            status="tunnel:$(docker inspect -f '{{.State.Status}}' tunnel)"
            for p in $EXPOSED; do
              curl -s -o /dev/null -m 5 "http://localhost:$(tr -dc 0-9 < "$p/port")" && status="$status $p:up" || status="$status $p:DOWN"
            done
            echo "$(date -u +%H:%M) UTC, $(( (end - $(date +%s)) / 60 )) min left | $status"
            sleep 60
          done

      - name: Container logs
        if: always()
        run: |
          docker ps -a
          for c in $(docker ps -a --format '{{.Names}}'); do
            echo "::group::$c"
            docker logs --tail 100 "$c" 2>&1
            echo "::endgroup::"
          done
