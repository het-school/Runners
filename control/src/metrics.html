<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runner metrics</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --soft: #f0efec;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-text: #006300;
    --heat-0: #cde2fb; --heat-1: #9ec5f4; --heat-2: #6da7ec; --heat-3: #3987e5; --heat-4: #256abf; --heat-5: #184f95; --heat-6: #0d366b;
    --heat-none: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --soft: #24241f;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      --good-text: #0ca30c;
      /* dark: near-zero recedes toward the surface, magnitude climbs to light blue */
      --heat-0: #104281; --heat-1: #184f95; --heat-2: #256abf; --heat-3: #3987e5; --heat-4: #6da7ec; --heat-5: #9ec5f4; --heat-6: #cde2fb;
      --heat-none: #24241f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--grid); }
  .bar { max-width: 1400px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 17px; }
  .brand span { color: var(--muted); font-weight: 500; }
  .seg { display: inline-flex; border: 1px solid var(--grid); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--ink-2); padding: 5px 11px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--grid); }
  .seg button[aria-pressed="true"] { background: var(--soft); color: var(--ink); font-weight: 650; }
  select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 5px 8px; }
  .spacer { flex: 1; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .links a { margin-left: 10px; color: var(--ink-2); font-size: 13px; }
  main { max-width: 1400px; margin: 0 auto; padding: 4px 16px 60px; transition: opacity .2s; }
  main.loading { opacity: .6; }
  h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); margin: 26px 0 10px; font-weight: 650; }
  h2 .meta { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 12px 14px; }
  .tile .label { color: var(--ink-2); font-size: 12.5px; }
  .tile .value { font-size: 24px; font-weight: 650; margin-top: 2px; white-space: nowrap; }
  .tile .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 12px 14px 8px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h3 { margin: 0; font-size: 14px; font-weight: 650; }
  .card .desc { color: var(--muted); font-size: 12px; margin: 1px 0 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); margin: 2px 0 4px; }
  .key { display: inline-block; width: 14px; height: 2px; border-radius: 1px; vertical-align: middle; margin-right: 5px; }
  .key.box { height: 10px; width: 10px; border-radius: 2px; }
  svg { display: block; overflow: visible; }
  svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart { position: relative; touch-action: pan-y; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; font-size: 13px; }
  #tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--ring);
         box-shadow: 0 6px 24px rgba(0,0,0,.14); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; display: none; min-width: 140px; }
  #tip .when { color: var(--muted); font-size: 11.5px; margin-bottom: 4px; }
  #tip .row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #tip .row b { font-weight: 650; font-variant-numeric: tabular-nums; min-width: 64px; }
  #tip .row span { color: var(--ink-2); }
  .tablewrap { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 11.5px; font-weight: 600; color: var(--ink-2); position: sticky; top: 0; background: var(--surface); }
  tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: var(--soft); }
  td .s { color: var(--muted); font-size: 12px; }
  .meter { display: inline-block; width: 46px; height: 6px; border-radius: 3px; background: var(--heat-none); vertical-align: middle; margin-left: 6px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 3px; background: var(--s1); }
  .meter i.warning { background: var(--warning); } .meter i.critical { background: var(--critical); }
  .st { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; }
  .st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .st.good::before { background: var(--good); } .st.warning::before { background: var(--warning); } .st.critical::before { background: var(--critical); }
  .heatlegend { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); margin: 0 0 4px; }
  .heatlegend .ramp { width: 120px; height: 8px; border-radius: 4px; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Runner <span>metrics</span></div>
    <div class="seg" id="views">
      <button data-view="fleet">Fleet</button><button data-view="machine">Machine</button><button data-view="app">App</button>
    </div>
    <select id="pick" aria-label="Machine or app" hidden></select>
    <div class="seg" id="ranges"></div>
    <div class="spacer"></div>
    <span class="meta" id="updated">Loading…</span>
    <span class="links"><a href="/">Status</a><a href="/admin">Admin</a></span>
  </div>
</header>
<main id="main"></main>
<div id="tip"></div>
<script>
// ---------- formatting ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const isNum = (x) => typeof x === "number" && Number.isFinite(x);
function compact(x, digits = 3) {
  if (!isNum(x)) return "–";
  const a = Math.abs(x);
  if (a >= 1e9) return +(x / 1e9).toPrecision(digits) + "G";
  if (a >= 1e6) return +(x / 1e6).toPrecision(digits) + "M";
  if (a >= 1e4) return +(x / 1e3).toPrecision(digits) + "K";
  if (a >= 100) return Math.round(x).toLocaleString();
  if (a >= 10) return +x.toFixed(1) + "";
  return +x.toFixed(2) + "";
}
function bytes(x) {
  if (!isNum(x)) return "–";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (Math.abs(x) >= 1000 && i < u.length - 1) { x /= 1000; i++; }
  return (Math.abs(x) >= 100 || i === 0 ? Math.round(x) : +x.toFixed(1)) + " " + u[i];
}
const F = {
  pct: (x) => (isNum(x) ? (Math.abs(x) >= 10 ? Math.round(x) : +x.toFixed(1)) + "%" : "–"),
  bytes,
  rate: (x) => (isNum(x) ? bytes(x) + "/s" : "–"),
  num: (x) => compact(x),
  persec: (x) => (isNum(x) ? compact(x) + "/s" : "–"),
  ms: (x) => (isNum(x) ? (x >= 100 ? Math.round(x) : +x.toFixed(1)) + " ms" : "–"),
  // input is % of one core; under one core it reads better as a percentage
  cores: (x) => (!isNum(x) ? "–" : x >= 100 ? +(x / 100).toFixed(2) + " cores" : +x.toFixed(x < 1 ? 2 : 1) + "% of a core"),
  load: (x) => (isNum(x) ? x.toFixed(2) : "–"),
};
// Axis ticks get as many decimals as the tick step needs, so neighbouring ticks never read the same.
const dec = (step) => Math.min(4, (String(+step.toPrecision(6)).split(".")[1] ?? "").length);
const fixed = (v, step) => (v >= 10000 ? compact(v, 2) : v.toFixed(dec(step)));
const AXIS = { pct: (x, s) => fixed(x, s) + "%", bytes: (x) => bytes(x).replace(" ", ""), rate: (x) => bytes(x).replace(" ", "") + "/s",
  num: fixed, persec: fixed, ms: (x, s) => fixed(x, s) + "ms", cores: (x, s) => fixed(x / 100, s / 100), load: fixed };
function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return s < 90 ? s + "s" : s < 5400 ? Math.round(s / 60) + "m" : s < 172800 ? (s / 3600).toFixed(1) + "h" : Math.round(s / 86400) + "d";
}
const SERIES = Array.from({ length: 8 }, (_, i) => `var(--s${i + 1})`);
const appLabel = (a) => (a === "_system" ? "system (router + tunnel)" : a);

// ---------- tooltip ----------
const tip = $("tip");
function showTip(e, when, rows) {
  tip.replaceChildren();
  const w = document.createElement("div");
  w.className = "when";
  w.textContent = when;
  tip.append(w);
  for (const r of rows) {
    const row = document.createElement("div");
    row.className = "row";
    if (r.color) {
      const k = document.createElement("i");
      k.className = "key";
      k.style.background = r.color;
      row.append(k);
    }
    const b = document.createElement("b");
    b.textContent = r.value;
    const s = document.createElement("span");
    s.textContent = r.name;
    row.append(b, s);
    tip.append(row);
  }
  tip.style.display = "block";
  const pad = 14;
  const { width, height } = tip.getBoundingClientRect();
  let x = e.clientX + pad;
  if (x + width > innerWidth - 8) x = e.clientX - width - pad;
  let y = e.clientY + pad;
  if (y + height > innerHeight - 8) y = e.clientY - height - pad;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => (tip.style.display = "none");
function fmtTime(t, step) {
  const d = new Date(t);
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return step >= 3600_000 || state.range === "24h" ? d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + time : time;
}

// ---------- charts ----------
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.append(e);
  return e;
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function xTicks(t0, t1, width) {
  const span = t1 - t0;
  const want = Math.max(2, Math.floor(width / 90));
  const steps = [5, 10, 15, 30, 60, 120, 180, 360, 720, 1440, 2880, 10080].map((m) => m * 60_000);
  const step = steps.find((s) => span / s <= want) ?? steps[steps.length - 1];
  const off = new Date().getTimezoneOffset() * 60_000;
  const out = [];
  for (let t = Math.ceil((t0 - off) / step) * step + off; t <= t1; t += step) out.push(t);
  return { ticks: out, step };
}
function tickLabel(t, step) {
  const d = new Date(t);
  if (step >= 1440 * 60_000) return d.toLocaleDateString([], { month: "short", day: "numeric" });
  const hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return d.getHours() === 0 && d.getMinutes() === 0 && step >= 60 * 60_000 ? d.toLocaleDateString([], { month: "short", day: "numeric" }) : hm;
}

// A card with a title, an optional legend and a chart body; returns the body element.
function card(parent, title, desc, wide) {
  const c = document.createElement("div");
  c.className = "card" + (wide ? " wide" : "");
  const h = document.createElement("h3");
  h.textContent = title;
  c.append(h);
  if (desc) {
    const d = document.createElement("div");
    d.className = "desc";
    d.textContent = desc;
    c.append(d);
  }
  const body = document.createElement("div");
  body.className = "chart";
  c.append(body);
  parent.append(c);
  return body;
}

// series: [{ name, values, color? }]; opts: { unit, stacked, ref: { value, name }, max, height }
function lineChart(body, t, series, opts = {}) {
  const unit = opts.unit ?? "num";
  series = series.filter((s) => s.values?.some(isNum));
  body.replaceChildren();
  if (!series.length) {
    body.innerHTML = '<div class="empty">No data in this range yet</div>';
    return;
  }
  series.forEach((s, i) => (s.color ??= SERIES[i % 8]));
  if (series.length > 1 || opts.ref) {
    const lg = document.createElement("div");
    lg.className = "legend";
    for (const s of series) {
      const it = document.createElement("span");
      const k = document.createElement("i");
      k.className = "key" + (opts.stacked ? " box" : "");
      k.style.background = s.color;
      it.append(k, document.createTextNode(s.name));
      lg.append(it);
    }
    if (opts.ref) {
      const it = document.createElement("span");
      const k = document.createElement("i");
      k.className = "key";
      k.style.background = "var(--axis)";
      it.append(k, document.createTextNode(opts.ref.name));
      lg.append(it);
    }
    body.append(lg);
  }
  const W = Math.max(260, body.clientWidth || body.parentElement.clientWidth - 28);
  const H = opts.height ?? 170;
  const L = 52, R = 10, T = 8, B = 22;
  const n = t.length;
  // stacked: each series sits on the sum of the ones before it
  const top = series.map((s) => s.values.slice());
  const base = series.map(() => new Array(n).fill(0));
  if (opts.stacked) {
    for (let i = 0; i < n; i++) {
      let acc = 0;
      const any = series.some((s) => isNum(s.values[i]));
      series.forEach((s, j) => {
        base[j][i] = any ? acc : null;
        acc += isNum(s.values[i]) ? s.values[i] : 0;
        top[j][i] = any ? acc : null;
      });
    }
  }
  let max = opts.max ?? 0;
  for (const arr of top) for (const v of arr) if (isNum(v) && v > max) max = v;
  if (opts.ref && isNum(opts.ref.value)) max = Math.max(max, opts.ref.value);
  if (!(max > 0)) max = 1;
  const step = niceStep(max / 4);
  const yMax = Math.ceil(max / step - 1e-9) * step;
  const t0 = t[0], t1 = t[n - 1];
  const x = (i) => L + ((t[i] - t0) / Math.max(1, t1 - t0)) * (W - L - R);
  const y = (v) => T + (1 - v / yMax) * (H - T - B);
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img" });
  for (let v = 0; v <= yMax + 1e-9; v += step) {
    el("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1, "shape-rendering": "crispEdges" }, svg);
    el("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = AXIS[unit](v, step);
  }
  const xt = xTicks(t0, t1, W - L - R);
  for (const tt of xt.ticks) {
    const px = L + ((tt - t0) / Math.max(1, t1 - t0)) * (W - L - R);
    el("text", { x: px, y: H - 5, "text-anchor": "middle" }, svg).textContent = tickLabel(tt, xt.step);
  }
  // paths, broken where data is missing
  const segs = (vals) => {
    const out = [];
    let cur = [];
    vals.forEach((v, i) => {
      if (isNum(v)) cur.push(i);
      else if (cur.length) { out.push(cur); cur = []; }
    });
    if (cur.length) out.push(cur);
    return out;
  };
  series.forEach((s, j) => {
    for (const seg of segs(top[j])) {
      const line = seg.map((i, k) => `${k ? "L" : "M"}${x(i).toFixed(1)},${y(top[j][i]).toFixed(1)}`).join("");
      if (opts.stacked || series.length === 1) {
        const lower = seg.slice().reverse().map((i) => `L${x(i).toFixed(1)},${y(opts.stacked ? base[j][i] : 0).toFixed(1)}`).join("");
        el("path", { d: line + lower + "Z", fill: s.color, "fill-opacity": opts.stacked ? 0.28 : 0.1, stroke: "none" }, svg);
      }
      if (seg.length === 1) el("circle", { cx: x(seg[0]), cy: y(top[j][seg[0]]), r: 2, fill: s.color }, svg);
      else el("path", { d: line, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    }
  });
  if (opts.ref && isNum(opts.ref.value)) {
    el("line", { x1: L, x2: W - R, y1: y(opts.ref.value), y2: y(opts.ref.value), stroke: "var(--axis)", "stroke-width": 1.5 }, svg);
  }
  // hover: crosshair snaps to the nearest point, one tooltip lists every series
  const hair = el("line", { y1: T, y2: H - B, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden" }, svg);
  const dots = series.map((s) => el("circle", { r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, svg));
  const hit = el("rect", { x: L, y: 0, width: W - L - R, height: H, fill: "transparent" }, svg);
  const move = (e) => {
    const r = svg.getBoundingClientRect();
    const px = e.clientX - r.left;
    const tt = t0 + ((px - L) / (W - L - R)) * (t1 - t0);
    let i = Math.round(((tt - t0) / Math.max(1, t1 - t0)) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    hair.setAttribute("x1", x(i));
    hair.setAttribute("x2", x(i));
    hair.setAttribute("visibility", "visible");
    series.forEach((s, j) => {
      const v = top[j][i];
      dots[j].setAttribute("visibility", isNum(s.values[i]) ? "visible" : "hidden");
      if (isNum(v)) { dots[j].setAttribute("cx", x(i)); dots[j].setAttribute("cy", y(v)); }
    });
    const rows = series.map((s) => ({ color: s.color, name: s.name, value: F[unit](s.values[i]) }));
    if (opts.stacked && series.length > 1) {
      const sum = series.reduce((a, s) => a + (isNum(s.values[i]) ? s.values[i] : 0), 0);
      rows.push({ name: "total", value: F[unit](sum) });
    }
    if (opts.ref) rows.push({ color: "var(--axis)", name: opts.ref.name, value: F[unit](opts.ref.value) });
    showTip(e, fmtTime(t[i], state.data.step), rows);
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => {
    hair.setAttribute("visibility", "hidden");
    dots.forEach((d) => d.setAttribute("visibility", "hidden"));
    hideTip();
  });
  body.append(svg);
}

// rows: [{ name, values, onClick? }]; one hue, light (low) to dark (high)
function heatmap(body, t, rows, opts = {}) {
  const unit = opts.unit ?? "num";
  rows = rows.map((r) => ({ ...r, values: r.values ?? [] }));
  body.replaceChildren();
  if (!rows.some((r) => r.values?.some(isNum))) {
    body.innerHTML = '<div class="empty">No data in this range yet</div>';
    return;
  }
  const cs = getComputedStyle(document.documentElement);
  const ramp = Array.from({ length: 7 }, (_, i) => cs.getPropertyValue(`--heat-${i}`).trim());
  const rgb = ramp.map((h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16)));
  let max = opts.max ?? 0;
  if (!opts.max) for (const r of rows) for (const v of r.values) if (isNum(v) && v > max) max = v;
  if (!(max > 0)) max = 1;
  const color = (v) => {
    const f = Math.max(0, Math.min(1, v / max)) * (rgb.length - 1);
    const i = Math.min(rgb.length - 2, Math.floor(f));
    const k = f - i;
    return `rgb(${rgb[i].map((c, j) => Math.round(c + (rgb[i + 1][j] - c) * k)).join(",")})`;
  };
  const lg = document.createElement("div");
  lg.className = "heatlegend";
  const lo = document.createElement("span");
  lo.textContent = F[unit](0);
  const bar = document.createElement("span");
  bar.className = "ramp";
  bar.style.background = `linear-gradient(90deg, ${ramp.join(",")})`;
  const hi = document.createElement("span");
  hi.textContent = F[unit](max) + (opts.max ? "" : " (peak)");
  lg.append(lo, bar, hi);
  body.append(lg);
  const W = Math.max(260, body.clientWidth || body.parentElement.clientWidth - 28);
  const L = 64, R = 10, T = 2, B = 22, rowH = 16, gap = 2;
  const H = T + rows.length * (rowH + gap) + B;
  const n = t.length;
  const cw = (W - L - R) / n;
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img" });
  rows.forEach((r, ri) => {
    const yy = T + ri * (rowH + gap);
    const lab = el("text", { x: L - 8, y: yy + rowH / 2 + 4, "text-anchor": "end", style: r.onClick ? "cursor:pointer" : "" }, svg);
    lab.textContent = r.name;
    if (r.onClick) lab.addEventListener("click", r.onClick);
    el("rect", { x: L, y: yy, width: W - L - R, height: rowH, fill: "var(--heat-none)", rx: 2 }, svg);
    // runs of equal color are drawn as one rect
    for (let i = 0; i < n; i++) {
      const v = r.values[i];
      if (!isNum(v)) continue;
      el("rect", { x: (L + i * cw).toFixed(2), y: yy, width: (cw + 0.6).toFixed(2), height: rowH, fill: color(v) }, svg);
    }
  });
  const xt = xTicks(t[0], t[n - 1], W - L - R);
  for (const tt of xt.ticks) {
    const px = L + ((tt - t[0]) / Math.max(1, t[n - 1] - t[0])) * (W - L - R - cw) + cw / 2;
    el("text", { x: px, y: H - 5, "text-anchor": "middle" }, svg).textContent = tickLabel(tt, xt.step);
  }
  const outline = el("rect", { width: Math.max(cw, 3), height: rowH, fill: "none", stroke: "var(--ink)", "stroke-width": 1.5, rx: 1, visibility: "hidden" }, svg);
  const hit = el("rect", { x: L, y: 0, width: W - L - R, height: H - B, fill: "transparent", style: "cursor:crosshair" }, svg);
  const locate = (e) => {
    const b = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - b.left - L) / cw)));
    const ri = Math.max(0, Math.min(rows.length - 1, Math.floor((e.clientY - b.top - T) / (rowH + gap))));
    return [i, ri];
  };
  hit.addEventListener("pointermove", (e) => {
    const [i, ri] = locate(e);
    outline.setAttribute("x", L + i * cw - (cw < 3 ? (3 - cw) / 2 : 0));
    outline.setAttribute("y", T + ri * (rowH + gap));
    outline.setAttribute("visibility", "visible");
    showTip(e, fmtTime(t[i], state.data.step), [{ name: rows[ri].name, value: F[unit](rows[ri].values[i]) }]);
  });
  hit.addEventListener("pointerleave", () => { outline.setAttribute("visibility", "hidden"); hideTip(); });
  hit.addEventListener("click", (e) => { const [, ri] = locate(e); rows[ri].onClick?.(); });
  body.append(svg);
}

function tiles(parent, list) {
  const wrap = document.createElement("div");
  wrap.className = "tiles";
  for (const tl of list) {
    const d = document.createElement("div");
    d.className = "tile";
    const l = document.createElement("div");
    l.className = "label";
    l.textContent = tl.label;
    const v = document.createElement("div");
    v.className = "value";
    v.textContent = tl.value;
    d.append(l, v);
    if (tl.sub) {
      const s = document.createElement("div");
      s.className = "sub";
      s.textContent = tl.sub;
      d.append(s);
    }
    wrap.append(d);
  }
  parent.append(wrap);
}
function section(parent, title, note) {
  const h = document.createElement("h2");
  h.textContent = title;
  if (note) {
    const s = document.createElement("span");
    s.className = "meta";
    s.textContent = note;
    h.append(s);
  }
  parent.append(h);
  const g = document.createElement("div");
  g.className = "grid";
  parent.append(g);
  return g;
}
const meter = (pct) => {
  const p = Math.max(0, Math.min(100, pct || 0));
  return `<span class="meter"><i class="${p >= 90 ? "critical" : p >= 75 ? "warning" : ""}" style="width:${p}%"></i></span>`;
};
function table(parent, head, rows, onClick) {
  const w = document.createElement("div");
  w.className = "tablewrap";
  w.innerHTML = `<table><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${
    rows.map((r, i) => `<tr data-i="${i}" class="${onClick ? "click" : ""}">${r.cells.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("") ||
    `<tr><td colspan="${head.length}" class="s">Nothing reporting right now</td></tr>`}</tbody></table>`;
  if (onClick) w.querySelectorAll("tbody tr[data-i]").forEach((tr) => tr.addEventListener("click", () => onClick(rows[tr.dataset.i])));
  parent.append(w);
}

// ---------- data helpers ----------
const state = { view: "fleet", pick: null, range: localStorage.getItem("metrics-range") || "1h", data: null };
const machineNums = () => {
  const d = state.data;
  const set = new Set(Object.keys(d.m).map(Number));
  for (const k of Object.keys(d.live)) set.add(Number(k));
  return [...set].sort((a, b) => a - b);
};
const hcol = (m, k) => state.data.m[m]?.h?.[k] ?? null;
const acol = (m, app, k) => state.data.m[m]?.a?.[app]?.[k] ?? null;
// Combine columns index by index; null where none of them has a value.
function combine(cols, how) {
  const n = state.data.t.length;
  const out = new Array(n).fill(null);
  for (let i = 0; i < n; i++) {
    const vals = cols.map((c) => c?.[i]).filter(isNum);
    if (!vals.length) continue;
    out[i] = how === "max" ? Math.max(...vals) : how === "min" ? Math.min(...vals) : how === "avg" ? vals.reduce((a, b) => a + b, 0) / vals.length : vals.reduce((a, b) => a + b, 0);
  }
  return out;
}
const map2 = (a, b, f) => (a ?? []).map((v, i) => (isNum(v) && isNum(b?.[i]) ? f(v, b[i]) : null));
const fleetH = (k, how = "sum") => combine(machineNums().map((m) => hcol(m, k)), how);
function appNames() {
  const set = new Set();
  for (const x of Object.values(state.data.m)) for (const a of Object.keys(x.a ?? {})) set.add(a);
  for (const x of Object.values(state.data.live)) for (const a of Object.keys(x.a ?? {})) set.add(a);
  for (const p of state.data.projects) set.add(p.name);
  return [...set].sort((a, b) => (a === "_system") - (b === "_system") || a.localeCompare(b));
}
// Apps stacked by a field: the biggest 7 keep a color, the rest fold into "other". Colors follow the app, not its rank.
function appStack(cols, unitTotal) {
  const names = appNames();
  const color = new Map(names.map((a, i) => [a, SERIES[i % 7]]));
  const totals = names.map((a) => [a, (cols(a) ?? []).reduce((s, v) => s + (isNum(v) ? v : 0), 0)]).filter(([, s]) => s > 0).sort((a, b) => b[1] - a[1]);
  const keep = totals.slice(0, totals.length > 8 ? 7 : 8).map(([a]) => a);
  const rest = totals.slice(keep.length).map(([a]) => a);
  const series = keep.map((a) => ({ name: appLabel(a), values: cols(a), color: names.indexOf(a) < 7 ? color.get(a) : SERIES[keep.indexOf(a) % 8] }));
  if (rest.length) series.push({ name: `other (${rest.length})`, values: combine(rest.map(cols), "sum"), color: "var(--s8)" });
  return series;
}
const liveRuns = () => Object.entries(state.data.live).map(([m, x]) => ({ m: Number(m), ...x })).sort((a, b) => a.m - b.m);
const sumLive = (f) => liveRuns().reduce((s, r) => s + (isNum(f(r)) ? f(r) : 0), 0);

// ---------- views ----------
// Four things everywhere: CPU, memory, disk I/O, network I/O.
const pctOf = (a, b) => (isNum(a) && b > 0 ? (100 * a) / b : null);
const io = (read, write) => `${F.rate(read)} <span class="s">${F.rate(write)}</span>`;

function renderFleet(main) {
  const d = state.data;
  const live = liveRuns();
  const memTotal = sumLive((r) => r.h.memTotal);
  const memUsed = sumLive((r) => r.h.memUsed);
  tiles(main, [
    { label: "CPU, fleet average", value: F.pct(live.length ? sumLive((r) => r.h.cpu) / live.length : null), sub: d.expected ? `${live.length} of ${d.expected} machines reporting` : `${live.length} machines reporting` },
    { label: "Memory used", value: memTotal ? F.pct((100 * memUsed) / memTotal) : "–", sub: `${bytes(memUsed)} of ${bytes(memTotal)}` },
    { label: "Disk read / write", value: F.rate(sumLive((r) => r.h.diskRead)), sub: `write ${F.rate(sumLive((r) => r.h.diskWrite))}` },
    { label: "Network in / out", value: F.rate(sumLive((r) => r.h.netRx)), sub: `out ${F.rate(sumLive((r) => r.h.netTx))}` },
  ]);
  const h = document.createElement("h2");
  h.textContent = "Machines now";
  main.append(h);
  table(main, ["Machine", "CPU", "Memory", "Disk read / write", "Network in / out"],
    live.map((r) => ({
      m: r.m,
      cells: [`<b>${r.m}</b>${r.ready ? "" : ' <span class="s">starting</span>'}`, F.pct(r.h.cpu) + meter(r.h.cpu),
        F.pct(pctOf(r.h.memUsed, r.h.memTotal)) + meter(pctOf(r.h.memUsed, r.h.memTotal)) + ` <span class="s">${bytes(r.h.memUsed)}</span>`,
        io(r.h.diskRead, r.h.diskWrite), io(r.h.netRx, r.h.netTx)],
    })), (row) => go("machine", row.m));

  const ms = machineNums();
  const rowsOf = (f) => ms.map((m) => ({ name: `machine ${m}`, values: f(m), onClick: () => go("machine", m) }));
  const heat = section(main, "Per machine", "darker = higher · click a row for that machine");
  heatmap(card(heat, "CPU", "% of all cores", true), d.t, rowsOf((m) => hcol(m, "cpu")), { unit: "pct", max: 100 });
  heatmap(card(heat, "Memory", "% used", true), d.t, rowsOf((m) => map2(hcol(m, "memUsed"), hcol(m, "memTotal"), (u, t) => (100 * u) / t)), { unit: "pct", max: 100 });
  heatmap(card(heat, "Disk I/O", "read + write", true), d.t, rowsOf((m) => map2(hcol(m, "diskRead"), hcol(m, "diskWrite"), (a, b) => a + b)), { unit: "rate" });
  heatmap(card(heat, "Network I/O", "in + out", true), d.t, rowsOf((m) => map2(hcol(m, "netRx"), hcol(m, "netTx"), (a, b) => a + b)), { unit: "rate" });

  const g = section(main, "Whole fleet");
  lineChart(card(g, "CPU", "average across machines, and the busiest machine"), d.t, [
    { name: "average", values: fleetH("cpu", "avg") }, { name: "busiest machine", values: fleetH("cpu", "max") },
  ], { unit: "pct" });
  lineChart(card(g, "Memory used", "all machines"), d.t, [{ name: "used", values: fleetH("memUsed") }],
    { unit: "bytes", ref: { name: "installed", value: Math.max(0, ...fleetH("memTotal").filter(isNum)) } });
  lineChart(card(g, "Disk I/O", "all machines"), d.t, [{ name: "read", values: fleetH("diskRead") }, { name: "write", values: fleetH("diskWrite") }], { unit: "rate" });
  lineChart(card(g, "Network I/O", "all machines"), d.t, [{ name: "in", values: fleetH("netRx") }, { name: "out", values: fleetH("netTx") }], { unit: "rate" });
  lineChart(card(g, "CPU by app", "summed over machines"), d.t, appStack((a) => combine(ms.map((m) => acol(m, a, "cpu")), "sum")), { unit: "cores", stacked: true });
  lineChart(card(g, "Memory by app", "summed over machines"), d.t, appStack((a) => combine(ms.map((m) => acol(m, a, "mem")), "sum")), { unit: "bytes", stacked: true });
}

function renderMachine(main, m) {
  const d = state.data;
  const r = d.live[m];
  const x = r?.h ?? {};
  const H = (k) => hcol(m, k);
  if (r) {
    tiles(main, [
      { label: "CPU", value: F.pct(x.cpu) },
      { label: "Memory used", value: F.pct(pctOf(x.memUsed, x.memTotal)), sub: `${bytes(x.memUsed)} of ${bytes(x.memTotal)}` },
      { label: "Disk read / write", value: F.rate(x.diskRead), sub: `write ${F.rate(x.diskWrite)}` },
      { label: "Network in / out", value: F.rate(x.netRx), sub: `out ${F.rate(x.netTx)}` },
    ]);
    const link = document.createElement("div");
    link.className = "note";
    link.innerHTML = `Run ${ago(d.now - r.started)} old · <a href="https://github.com/${esc(d.repo)}/actions/runs/${esc(r.run)}" target="_blank" rel="noopener">GitHub Actions run ${esc(r.run)}</a>`;
    main.append(link);
  } else {
    const n = document.createElement("div");
    n.className = "note";
    n.textContent = `Machine ${m} isn't reporting right now; the charts show what it sent earlier.`;
    main.append(n);
  }
  const g = section(main, "Machine");
  lineChart(card(g, "CPU", "average and peak, % of all cores"), d.t, [{ name: "average", values: H("cpu") }, { name: "peak", values: H("cpuMax") }], { unit: "pct" });
  lineChart(card(g, "Memory used"), d.t, [{ name: "used", values: H("memUsed") }],
    { unit: "bytes", ref: { name: "installed", value: x.memTotal ?? Math.max(0, ...(H("memTotal") ?? []).filter(isNum)) } });
  lineChart(card(g, "Disk I/O"), d.t, [{ name: "read", values: H("diskRead") }, { name: "write", values: H("diskWrite") }], { unit: "rate" });
  lineChart(card(g, "Network I/O"), d.t, [{ name: "in", values: H("netRx") }, { name: "out", values: H("netTx") }], { unit: "rate" });

  const apps = section(main, "Apps on this machine");
  const A = (k) => (a) => acol(m, a, k);
  const sum2 = (k1, k2) => (a) => map2(acol(m, a, k1), acol(m, a, k2), (p, q) => p + q);
  lineChart(card(apps, "CPU by app"), d.t, appStack(A("cpu")), { unit: "cores", stacked: true });
  lineChart(card(apps, "Memory by app"), d.t, appStack(A("mem")), { unit: "bytes", stacked: true });
  lineChart(card(apps, "Disk I/O by app", "read + write"), d.t, appStack(sum2("diskRead", "diskWrite")), { unit: "rate", stacked: true });
  lineChart(card(apps, "Network I/O by app", "in + out; apps on host networking aren't counted"), d.t, appStack(sum2("netRx", "netTx")), { unit: "rate", stacked: true });
  if (r) {
    const h = document.createElement("h2");
    h.textContent = "Apps now";
    main.append(h);
    table(main, ["App", "CPU", "Memory", "Disk read / write", "Network in / out"],
      Object.entries(r.a).sort(([a], [b]) => (a === "_system") - (b === "_system") || a.localeCompare(b)).map(([a, v]) => ({
        app: a,
        cells: [`<b>${esc(appLabel(a))}</b>`, F.cores(v.cpu), bytes(v.mem), io(v.diskRead, v.diskWrite), io(v.netRx, v.netTx)],
      })), (row) => go("app", row.app));
  }
}

function renderApp(main, app) {
  const d = state.data;
  const ms = machineNums();
  const inst = liveRuns().filter((r) => r.a?.[app]).map((r) => ({ r, v: r.a[app] }));
  const total = (k) => inst.reduce((s, x) => s + (x.v[k] ?? 0), 0);
  tiles(main, [
    { label: "CPU", value: F.cores(total("cpu")), sub: `${inst.length} machines running it` },
    { label: "Memory", value: bytes(total("mem")), sub: "all machines" },
    { label: "Disk read / write", value: F.rate(total("diskRead")), sub: `write ${F.rate(total("diskWrite"))}` },
    { label: "Network in / out", value: F.rate(total("netRx")), sub: `out ${F.rate(total("netTx"))}` },
  ]);
  const h = document.createElement("h2");
  h.textContent = "Per machine now";
  main.append(h);
  table(main, ["Machine", "CPU", "Memory", "Disk read / write", "Network in / out"],
    inst.map(({ r, v }) => ({ m: r.m, cells: [`<b>${r.m}</b>`, F.cores(v.cpu), bytes(v.mem), io(v.diskRead, v.diskWrite), io(v.netRx, v.netTx)] })),
    (row) => go("machine", row.m));

  const rowsOf = (f) => ms.map((m) => ({ name: `machine ${m}`, values: f(m), onClick: () => go("machine", m) }));
  const sum2 = (m, k1, k2) => map2(acol(m, app, k1), acol(m, app, k2), (p, q) => p + q);
  const heat = section(main, "Per machine");
  heatmap(card(heat, "CPU", "% of one core", true), d.t, rowsOf((m) => acol(m, app, "cpu")), { unit: "pct" });
  heatmap(card(heat, "Memory", "", true), d.t, rowsOf((m) => acol(m, app, "mem")), { unit: "bytes" });
  heatmap(card(heat, "Disk I/O", "read + write", true), d.t, rowsOf((m) => sum2(m, "diskRead", "diskWrite")), { unit: "rate" });
  heatmap(card(heat, "Network I/O", "in + out", true), d.t, rowsOf((m) => sum2(m, "netRx", "netTx")), { unit: "rate" });

  const A = (k) => combine(ms.map((m) => acol(m, app, k)), "sum");
  const g = section(main, "All machines together");
  lineChart(card(g, "CPU"), d.t, [{ name: "CPU", values: A("cpu") }], { unit: "cores" });
  lineChart(card(g, "Memory"), d.t, [{ name: "memory", values: A("mem") }], { unit: "bytes" });
  lineChart(card(g, "Disk I/O"), d.t, [{ name: "read", values: A("diskRead") }, { name: "write", values: A("diskWrite") }], { unit: "rate" });
  lineChart(card(g, "Network I/O", "apps on host networking aren't counted"), d.t, [{ name: "in", values: A("netRx") }, { name: "out", values: A("netTx") }], { unit: "rate" });
}

// ---------- shell ----------
const RANGES = ["1h", "6h", "24h", "7d", "30d"];
$("ranges").innerHTML = RANGES.map((r) => `<button data-range="${r}">${r}</button>`).join("");
$("ranges").addEventListener("click", (e) => {
  const r = e.target.dataset.range;
  if (!r) return;
  state.range = r;
  localStorage.setItem("metrics-range", r);
  load();
});
$("views").addEventListener("click", (e) => e.target.dataset.view && go(e.target.dataset.view));
$("pick").addEventListener("change", (e) => go(state.view, e.target.value));
function go(view, pick) {
  location.hash = view === "fleet" ? "fleet" : `${view}/${encodeURIComponent(pick ?? "")}`;
}
function readHash() {
  const [view, pick] = location.hash.slice(1).split("/");
  state.view = ["machine", "app"].includes(view) ? view : "fleet";
  state.pick = pick ? decodeURIComponent(pick) : null;
}
addEventListener("hashchange", () => { readHash(); render(); scrollTo(0, 0); });

function render() {
  const d = state.data;
  document.querySelectorAll("#views button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === state.view));
  document.querySelectorAll("#ranges button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.range === state.range));
  if (!d) return;
  const pick = $("pick");
  const main = $("main");
  const y = scrollY;
  main.replaceChildren();
  hideTip();
  if (state.view === "machine") {
    const ms = machineNums();
    if (!state.pick || !ms.includes(Number(state.pick))) state.pick = String(ms.find((m) => d.live[m]) ?? ms[0] ?? 1);
    pick.innerHTML = ms.map((m) => `<option value="${m}">machine ${m}${d.live[m] ? "" : " (not reporting)"}</option>`).join("");
    pick.value = state.pick;
    pick.hidden = false;
    renderMachine(main, Number(state.pick));
  } else if (state.view === "app") {
    const apps = appNames();
    if (!state.pick || !apps.includes(state.pick)) state.pick = apps.find((a) => a !== "_system") ?? apps[0];
    pick.innerHTML = apps.map((a) => `<option value="${esc(a)}">${esc(appLabel(a))}</option>`).join("");
    pick.value = state.pick;
    pick.hidden = false;
    if (state.pick) renderApp(main, state.pick);
  } else {
    pick.hidden = true;
    renderFleet(main);
  }
  scrollTo(0, y);
}

let loading = false;
async function load() {
  if (loading) return;
  loading = true;
  $("main").classList.add("loading");
  render();
  try {
    const res = await fetch(`/api/metrics?range=${state.range}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.data = await res.json();
    state.loadedAt = Date.now();
    render();
  } catch (e) {
    $("updated").textContent = `Couldn't load metrics (${e.message})`;
  } finally {
    loading = false;
    $("main").classList.remove("loading");
  }
}
setInterval(() => {
  if (state.loadedAt) $("updated").textContent = `Updated ${ago(Date.now() - state.loadedAt)} ago · ${state.data.step / 60000}-min points`;
}, 1000);
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
readHash();
load();
setInterval(() => document.visibilityState === "visible" && load(), 20_000);
</script>
</body>
</html>
