name: ssh
run-name: Ubuntu SSH via Cloudflare tunnel

on:
  workflow_dispatch:

# Starting a new run cancels the one already running.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # hard cap for GitHub-hosted runners (6 hours)
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Start SSH server
        env:
          HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          AUTHORIZED_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          [ -n "$HOST_KEY" ] || { echo "::error::Add an SSH_HOST_KEY repository secret first."; exit 1; }
          [ -n "$AUTHORIZED_KEYS" ] || { echo "::error::Add an SSH_AUTHORIZED_KEYS repository secret first."; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server > /dev/null
          # Same host key every run, so clients can verify it under one known_hosts alias.
          printf '%s\n' "$HOST_KEY" | sudo tee /etc/ssh/ssh_host_runner_key > /dev/null
          sudo chmod 600 /etc/ssh/ssh_host_runner_key
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUTHORIZED_KEYS" > ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          # Key-only login as the runner user (it has passwordless sudo).
          # 00- so it's read before the image's own sshd_config.d files; sshd keeps the first value it sees.
          printf '%s\n' 'HostKey /etc/ssh/ssh_host_runner_key' 'PasswordAuthentication no' 'KbdInteractiveAuthentication no' \
            'PermitRootLogin no' "AllowUsers $USER" \
            | sudo tee /etc/ssh/sshd_config.d/00-runner.conf > /dev/null
          sudo systemctl restart ssh

      - name: Open Cloudflare quick tunnel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A quick tunnel needs no account; clients reach it with `cloudflared access ssh --hostname <host>`.
          docker run -d --name tunnel --network host cloudflare/cloudflared:latest \
            tunnel --no-autoupdate --url ssh://localhost:22
          for i in $(seq 30); do
            docker logs tunnel 2>&1 | grep -q 'Registered tunnel connection' && break
            sleep 2
          done
          docker logs tunnel 2>&1 | grep -q 'Registered tunnel connection' || { docker logs tunnel; exit 1; }
          host=$(docker logs tunnel 2>&1 | grep -oE '[a-z0-9-]+\.trycloudflare\.com' | head -1)
          echo "Tunnel host: $host"
          # Logs aren't readable until the job ends, so post the host as a commit status too.
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context="ssh-tunnel" \
            -f description="$host" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

      - name: Keep alive
        run: |
          # Finish 5 minutes before the 6-hour cap so the job ends green instead of being killed.
          end=$(( START + 355 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            if [ "$(docker inspect -f '{{.State.Running}}' tunnel)" != "true" ]; then
              echo "::error::tunnel stopped"; docker logs --tail 50 tunnel; exit 1
            fi
            echo "alive at $(date -u +%H:%M:%S) UTC, $(( (end - $(date +%s)) / 60 )) min left"
            sleep 60
          done
