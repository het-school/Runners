name: ubuntu-vm
run-name: Ubuntu VM

on:
  workflow_dispatch:

# Starting a new run cancels the one already running.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # hard cap for GitHub-hosted runners (6 hours)
    steps:
      - name: Start Ubuntu VM
        env:
          PASS: ${{ secrets.VM_PASSWORD }}
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          # The viewer URL shows up in public logs, so never start without a password.
          [ -n "$PASS" ] || { echo "::error::Add a VM_PASSWORD repository secret first."; exit 1; }
          docker run -d --name vm \
            -e BOOT=ubuntu -e RAM_SIZE=12G -e CPU_CORES=max -e USERNAME=ubuntu -e PASS \
            -p 127.0.0.1:8006:8006 \
            --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN \
            -v /mnt/vm:/storage --stop-timeout 120 \
            qemux/qemu

      - name: Open tunnel
        run: |
          docker run -d --name tunnel --network host cloudflare/cloudflared:latest \
            tunnel --no-autoupdate --url http://localhost:8006
          for i in $(seq 60); do
            url=$(docker logs tunnel 2>&1 | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | head -1)
            [ -n "$url" ] && break
            sleep 2
          done
          [ -n "$url" ] || { docker logs tunnel; exit 1; }
          # A notice shows at the top of the run page while the job is still running.
          echo "::notice title=Ubuntu VM::$url"

      - name: Keep alive
        run: |
          # Finish 5 minutes before the 6-hour cap so the job ends green instead of being killed.
          end=$(( START + 355 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            for c in vm tunnel; do
              if [ "$(docker inspect -f '{{.State.Running}}' "$c")" != "true" ]; then
                echo "::error::$c stopped"; docker logs --tail 50 "$c"; exit 1
              fi
            done
            echo "alive at $(date -u +%H:%M:%S) UTC, $(( (end - $(date +%s)) / 60 )) min left"
            sleep 60
          done
