name: watchdog

# This account's only automatic supply trigger. Use a different minute offset
# in each participating repository; keep the ten-minute interval.
on:
  schedule:
    - cron: "4-59/10 * * * *"
  # A manual run previews the plan and never dispatches machines.
  workflow_dispatch:

concurrency:
  group: provider-capacity
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    if: ${{ vars.CONTROL_URL != '' && (vars.MACHINE_COUNT != '' || vars.POOL_SIZE != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.AGENT_REPO || github.repository }}
          persist-credentials: false
      - name: Reconcile scheduled machine supply
        env:
          GH_TOKEN: ${{ github.token }}
          MACHINE_COUNT: ${{ vars.MACHINE_COUNT || vars.POOL_SIZE }}
          SERVER_TAG: ${{ vars.SERVER_TAG || vars.POOL || 'github' }}
          MACHINE_REF: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/capacity.mjs
