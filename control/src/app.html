}

// The join command: shown after the password, with the newcomers that checked in since.
function joinBlock() {
  const st = S.status;
  const newcomers = joinInfo ? st.runs.filter((r) => !joinInfo.slots.has(r.id) && r.live) : [];
  if (joinInfo) return `${codebox(joinInfo.command)}<p class="hint">The token in it is a secret: anyone who has it can add a machine to the fleet.</p>
    <div style="margin-top:10px">${newcomers.length ? newcomers.map((r) => `<div class="ok-line">✓ Machine ${r.machine} joined (${esc(r.label || r.id)}) <a href="${machineHref(r.machine)}">Open</a></div>`).join("") : `<span class="meta">${pill("deploying", "waiting")} for a new machine to check in…</span>`}</div>`;
  return `<div class="row" style="align-items:flex-end">
      <div><label class="f" for="cj-label">Name (optional)</label><input id="cj-label" placeholder="its hostname" style="width:180px"></div>
      <button type="button" class="primary" data-act="join">Show the join command${lockmark()}</button></div>
    <p class="hint">Showing it needs the fleet password, because the command carries the join token. Without the password, ask the fleet's owner for the command.</p>`;
}

function vContribute() {
  const o = location.origin;
  return {
    title: "Contribute a machine",
    html: `<h1>Contribute a machine</h1><div class="sub">Add a computer to the fleet: it gets a machine number and its own Cloudflare tunnel, and runs the app replicas placed on it.</div>
      <div class="card guide" style="margin-top:12px">
        <h3 style="margin-top:4px">What you need</h3>
        <ol><li>A Linux machine (a VM, a server, a spare PC) with <a href="https://docs.docker.com/engine/install/" target="_blank" rel="noopener">Docker</a> installed. 2 CPU cores and 2 GB of memory or more is a good start.</li>
          <li>Outbound internet. No open ports, port forwarding or public IP: the machine dials out through its tunnel.</li>
          <li>The join command, which carries the fleet's join token (below).</li></ol>
        <div class="warnbox"><b>Only contribute a machine you're happy for others to run code on.</b> Anyone can deploy apps to this fleet, and an app placed on your machine runs as Docker containers with whatever its compose file asks for, which can include host folders and privileged access. A dedicated VM is the safe choice.</div>
        <h3>1. Get the join command</h3>
        <div id="cj-join"></div>
        <h3>2. Run it on the machine</h3>
        <p>It runs <a href="/install.sh" target="_blank" rel="noopener">install.sh</a> from the control plane (read it first if you like), which starts the agent in the container <code>runner-agent</code>. The agent downloads its latest code each time it starts, joins, and keeps its machine number across restarts.</p>
        ${codebox(`curl -fsSL ${o}/install.sh | sudo JOIN_TOKEN=<token> sh`)}
        <p>Options, as more <code>NAME=value</code> before <code>sh</code>:</p>
        <ul><li><code>LABEL=&lt;name&gt;</code>: what the pages call it (default: its hostname).</li>
          <li><code>RUNNER_DATA=&lt;folder&gt;</code>: where it keeps its files (default <code>/var/lib/runner</code>).</li></ul>
        <h3>3. Check it joined</h3>
        <p>Within a minute it shows up under <a href="#/machines">Machines</a>, and new replicas start going to it. Follow it on the machine with <code>docker logs -f runner-agent</code>.</p>
        <h3>Leave the fleet</h3>
        ${codebox("docker rm -f runner-agent tunnel router")}
        <p>Its replicas move to other machines within about a minute. Then the fleet's owner can retire its slot (on its machine page) so its tunnel and DNS names are removed.</p>
      </div>`,
    status() {
      // A poll mustn't redraw the form while someone's typing in it; once the command is shown, it follows newcomers.
      const box = $("#cj-join");
      if (joinInfo || !$("#cj-label", box)) box.innerHTML = joinBlock();
      else $("[data-act=join]", box).innerHTML = `Show the join command${lockmark()}`;
    },
    click(e) {
      const b = e.target.closest("[data-act=join]");
      if (!b) return;
      showJoin($("#cj-label").value.trim());
    },
  };
}

function vGuide() {
  const o = location.origin, dom = () => S.status?.domain ?? "<domain>";
  return {
    title: "Guide",
    html: `<h1>Deploying apps</h1><div class="card guide" style="margin-top:12px" id="guide"></div>`,
    status() {
      if ($("#guide").childElementCount) return;
      const d = esc(dom());
      $("#guide").innerHTML = `
      <p>An app is a <b>Docker Compose file</b>, a <b>Dockerfile</b>, or both, plus any text files the build needs. It runs as many <b>replicas</b> as it asks for (1 to 10, 1 by default), each on a different machine, picked by the most free CPU and memory. With fewer machines than replicas, it runs on every machine, and the rest start as machines join.
        Each replica has its own URL: replica <i>k</i> is always at <code>https://&lt;name&gt;-<i>k</i>.${d}</code>, whichever machine it's on. There's no shared URL that spreads visitors across replicas, so hand out the replica URL you want people on.
        Each deploy is a new version; if it fails, the replicas go back to the last good one.</p>
      <h3>From this site</h3>
      <ol><li>Open <a href="#/apps/new">New app</a>, or start from one of its examples.</li>
        <li><b>Name:</b> lowercase letters, digits and dashes, like <code>my-app</code>.</li>
        <li><b>Port:</b> what the app listens on (or <code>x-runner.port</code> in the compose file).</li>
        <li>Paste a compose file and/or a Dockerfile, and add (or upload) anything the build <code>COPY</code>s.</li>
        <li><b>Password:</b> changing, disabling or deleting the app later needs it (or the fleet password). If it's lost, only the fleet's owner can set a new one.</li>
        <li><b>Deploy.</b> The app's page shows each replica come up, and every machine's error if one fails.</li></ol>
      <p class="hint">Roll back from the app's Versions list: <b>Roll back</b> deploys that version's files again (it becomes the newest version) and keeps the replica count. The app's page also has <b>Change password</b>.</p>
      <h3>With the API</h3>
      <p>Send JSON to <code>PUT ${esc(o)}/admin/api/projects/&lt;name&gt;</code>. Fields: <code>compose</code>, <code>dockerfile</code>, <code>files</code> (<code>{"path": "text"}</code>), <code>port</code>, <code>replicas</code> (1–10, default 1; with fewer machines than replicas, it runs on every machine), and for a new app <code>password</code> (${MIN_APP_PASSWORD} characters or more).
        After that, every change to the app (<code>PUT</code>, <code>/disable</code>, <code>/enable</code>, <code>/move</code>, <code>DELETE</code>) needs the header <code>x-app-password</code>; <code>PUT …/projects/&lt;name&gt;/password</code> with <code>{"password": "new"}</code> changes it.
        The fleet password, in <code>x-fleet-password</code>, can change any app, and fleet changes (<code>/settings</code>, <code>/roll</code>, <code>/machines/&lt;n&gt;/evict</code>, <code>/slots/&lt;n&gt;</code>, <code>/join-token</code>) need it.</p>
      ${codebox(`curl -X PUT ${o}/admin/api/projects/whoami \\\n  -H 'Content-Type: application/json' \\\n  -d '{"port": 8080, "replicas": 2, "password": "choose-one", "compose": "services:\\n  web:\\n    image: traefik/whoami\\n    command: [\\"--port\\", \\"8080\\"]\\n    ports: [\\"8080:8080\\"]\\n"}'`)}
      <p class="hint">Files on disk: let <code>jq</code> build the body. Updating an app that exists: drop <code>password</code> and send <code>-H "x-app-password: $PW"</code>.</p>
      ${codebox(`jq -n --rawfile df my-app/Dockerfile --rawfile app my-app/app.py --arg pw "$PW" \\\n  '{port: 8000, dockerfile: $df, files: {"app.py": $app}, password: $pw}' |\ncurl -X PUT ${o}/admin/api/projects/my-app -H 'Content-Type: application/json' --data-binary @-`)}
      ${codebox(`B=${o}/admin/api; P="x-app-password: $PW"\ncurl $B/status                                  # every app and machine\ncurl $B/projects/my-app                         # the current spec and its versions\ncurl $B/projects/my-app?version=2               # an earlier version\ncurl -X POST $B/projects/my-app/disable -H "$P" # stop it everywhere, keep its versions\ncurl -X POST $B/projects/my-app/enable -H "$P"\ncurl -X DELETE $B/projects/my-app -H "$P"       # delete it and its versions`)}
      <p class="hint">With the repo checked out, <code>bin/runnerctl apply &lt;folder or file&gt; [name] --port N</code> does this for you. Limits: 30 files, 250 KB, text only; ports 2019 and 19080 are taken.</p>
      <h3>Add a machine</h3>
      <p>Any Linux machine with Docker can join: see <a href="#/contribute">Contribute a machine</a>.</p>`;
    },
  };
}

// ======================================================================== shell
let view = null, current = "";
function parseHash() {
  const [path, query = ""] = location.hash.replace(/^#\/?/, "").split("?");
  return { parts: path.split("/").filter(Boolean).map(decodeURIComponent), q: new URLSearchParams(query) };
}
function route() {
  const { parts, q } = parseHash();
  const [a, b, c] = parts;
  view = a === "apps" && b === "new" ? vEditor(null, q.get("sample"))
    : a === "apps" && b && c === "edit" ? vEditor(b)
    : a === "apps" && b ? vApp(b)
    : a === "apps" ? vApps()
    : a === "machines" && b ? vMachine(Number(b))
    : a === "machines" ? vMachines()
    : a === "metrics" ? vMetrics()
    : a === "fleet" ? vFleet()
    : a === "guide" ? vGuide()
    : a === "contribute" ? vContribute()
    : vOverview();
  current = location.hash;
  document.title = `${view.title} · Runner`;
  hideTip();
  main.innerHTML = view.html + `<footer class="foot"><a href="#/guide">Deploy guide</a> · <a href="#/contribute">Contribute a machine</a> · <a href="/install.sh" target="_blank" rel="noopener">install.sh</a></footer>`;
  main.onclick = (e) => {
    const tr = e.target.closest("tr[data-href]");
    if (tr && !e.target.closest("a,button,input,select")) location.hash = tr.dataset.href;
    view.click?.(e);
  };
  const sec = ["apps", "machines", "metrics", "fleet"].includes(a) ? a : ["guide", "contribute"].includes(a) ? null : "";
  for (const link of $$("nav.tabs a")) {
    if (link.dataset.nav === sec) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  }
  view.mount?.();
  draw();
  if (view.wantsMetrics && !S.metrics) loadMetrics();
}
function draw() {
  if (!view) return;
  hideTip();
  if (S.status) view.status?.();
  if (S.metrics && view.charts) view.charts();
}
function renderChrome() {
  const lock = $("#lock");
  lock.innerHTML = `${LOCK(Boolean(pw))} ${pw ? "Unlocked" : "Locked"}`;
  lock.className = pw ? "open" : "";
  lock.title = pw ? "Lock: forget the fleet password on this browser" : "Unlock fleet changes with the password";
  const banner = $("#banner");
  banner.hidden = !S.statusErr;
  if (S.statusErr) banner.textContent = `${S.statusErr}. ${S.status ? `Showing what it said ${ago(Date.now() - S.statusAt)} ago.` : ""}`;
  if (!S.status) { $("#summary").textContent = S.statusErr ? "" : "Loading…"; return; }
  const n = problems().filter((x) => x.kind === "failed" || x.kind === "gone").length;
  $("#summary").innerHTML = `${pill(n ? "failed" : "healthy", `${runsBy().size} up${n ? ` · ${n} problem${n === 1 ? "" : "s"}` : ""}`)}`;
}

// Global controls: copy buttons, the time range, the lock.
document.addEventListener("click", async (e) => {
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    try { await navigator.clipboard.writeText($("pre", copy.parentElement).textContent); copy.textContent = "Copied"; setTimeout(() => (copy.textContent = "Copy"), 1500); }
    catch { toast("Couldn't copy", { kind: "failed" }); }
  }
  const range = e.target.closest("[data-range]");
  if (range) {
    S.range = range.dataset.range;
    localStorage.setItem("metrics-range", S.range);
    $$("[data-range]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.range === S.range));
    loadMetrics();
  }
});
$("#lock").onclick = () => {
  if (!pw) return unlock();
  forgetPw();
  toast("Fleet locked: the password is forgotten on this browser");
};

// Leaving the editor with changes asks first.
addEventListener("hashchange", () => {
  if (dirty && location.hash !== current) {
    if (!confirm("Leave without deploying? Your changes will be lost.")) { history.replaceState(null, "", current); return; }
    dirty = false;
  }
  route();
  scrollTo(0, 0);
});
addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });
let resizeTimer;
let lastWidth = innerWidth;
addEventListener("resize", () => {
  if (innerWidth === lastWidth) return; // phones fire resize on scroll as the toolbar hides
  lastWidth = innerWidth;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => view?.charts && S.metrics && view.charts(), 200);
});

// Old links: /admin#<app>, /admin#guide, and /metrics#fleet, #machine/<n>, #app/<name> (the server sends ?from=metrics).
(function legacy() {
  const h = location.hash.slice(1), from = new URLSearchParams(location.search).get("from");
  if (location.search) history.replaceState(null, "", "/" + location.hash);
  if (h.startsWith("/")) return;
  let to = null;
  if (from === "metrics") {
    const [v, pick] = h.split("/");
    to = v === "machine" && pick ? `#/machines/${pick}` : v === "app" && pick ? `#/apps/${pick}` : "#/metrics";
  } else if (h === "guide") to = "#/guide";
  else if (h) to = `#/apps/${h}`;
  else if (from === "admin") to = "#/apps";
  if (to) history.replaceState(null, "", "/" + to);
})();

route();
loadStatus();
setInterval(() => {
  if (document.hidden) return;
  if (Date.now() < S.fastUntil || Date.now() - S.statusAt >= 10_000) loadStatus();
}, 3000);
setInterval(() => { if (!document.hidden && view?.wantsMetrics) loadMetrics(); }, 30_000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadStatus(); if (view?.wantsMetrics) loadMetrics(); } });
</script>
</body>
</html>
