name: machine
run-name: machine scheduled ${{ inputs.schedule_run }}

# One machine of the fleet. Its agent joins the control plane configured in vars.CONTROL_URL, which
# gives it a fresh slot and keeps the projects in line. The account's cron
# supplies hosts; this job only declares its lifetime and runs the generic agent.
on:
  workflow_dispatch:
    inputs:
      schedule_run:
        description: Scheduled watchdog run in this repository that requested this host
        required: true

permissions:
  actions: read # verify the scheduled origin; machine jobs cannot dispatch hosts
  contents: read

jobs:
  agent:
    if: ${{ vars.CONTROL_URL != '' }}
    name: machine
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to a new release now and then, and a machine shouldn't change under the fleet
    timeout-minutes: 360 # GitHub's limit; the agent leaves at 355 minutes at the latest (LIFETIME_MIN below)
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.AGENT_REPO || github.repository }} # another account's copy runs this repo's agent (README: Another GitHub account)
          persist-credentials: false # the agent never uses git, so the job's token needn't be left on disk for the apps to find

      - name: Verify scheduled origin
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_RUN: ${{ inputs.schedule_run }}
        run: node .github/scripts/verify-schedule.mjs

      - name: Agent
        id: agent
        shell: bash
        env:
          CONTROL_URL: ${{ vars.CONTROL_URL }}
          JOIN_TOKEN: ${{ secrets.JOIN_TOKEN }}
          # Required origin metadata; it never declares how many servers should exist.
          RUNNER_DATA: ${{ runner.temp }}
          SERVER_TAG: ${{ vars.SERVER_TAG || vars.POOL || 'github' }}
          MACHINE: "0"
          REGION: ${{ vars.REGION }} # optional custom placement label; otherwise use automatic US grouping when available
          # This job's lifetime: the agent reports its deadline, and the control plane schedules its departure from it
          # (apps move off between 4 h and 5 h 10 min in, spread across the pool). Matches the timeout below.
          LIFETIME_MIN: 355
        run: |
          [ -n "$JOIN_TOKEN" ] || { echo "::error::the JOIN_TOKEN secret isn't set"; exit 1; }
          # A backstop for the control plane's own scheduling (for one release): at 330 minutes, if this machine is still
          # here, it asks to leave, which the control plane treats as urgent. The ping keeps trying for up to 15 minutes.
          ( sleep $(( 330*60 )) && curl -sS --max-time 20 --retry 20 --retry-all-errors --retry-max-time 900 \
              -X POST -H "Authorization: Bearer $JOIN_TOKEN" -H 'Content-Type: application/json' \
              -d "{\"agent\": \"$(cat "$RUNNER_DATA/agent-id")\"}" "$CONTROL_URL/api/drain" ) &
          # Stop before GitHub kills the job at 6 hours; the deadline and backstop drain announce departure.
          # exec: the agent is the step's own process, so a cancelled run's signal reaches it too (timeout passes it on and keeps its exit status).
          exec timeout -k 2m --preserve-status 355m node agent/agent.mjs

      # The agent's own containers only: what the apps log is theirs, and these run logs are public.
      - name: Router and tunnel logs
        if: always()
        env:
          CONTROL_URL: ${{ vars.CONTROL_URL }}
        run: |
          [ -f agent/runtime.mjs ] || { echo "No ownership-aware agent checkout; skipping infrastructure logs."; exit 0; }
          owner=$(node --input-type=module -e 'import {namespace} from "./agent/runtime.mjs"; console.log(namespace(process.env.CONTROL_URL))')
          for component in tunnel router; do
            docker ps -a --filter "label=io.runners.owner=$owner" --filter "label=io.runners.component=$component" \
              --format '{{.ID}} {{.Label "io.runners.copy"}}' | while read -r container copy; do
              [ -n "$container" ] && [ -z "$copy" ] || continue
              # App-provided component labels must never expose app logs here.
              if [ "$component" = tunnel ]; then docker stop -t 10 "$container" >/dev/null 2>&1 || true; fi
              echo "::group::$component ($container)"
              docker inspect --format '{{.Name}} {{.State.Status}} {{.Config.Image}}' "$container"
              docker logs --tail 100 "$container" 2>&1 || true
              echo "::endgroup::"
            done
          done
